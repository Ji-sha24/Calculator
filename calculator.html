<!DOCTYPE html>
<html>
    <head>
        <title>Calculator</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="css/calculator.css">
        <script src="js/calculator.js"></script>
    </head>
    <body>
        <div>
            <p class="display"></p>
        </div>
        <div>
            <button onclick="calculation='';document.querySelector('.display').innerHTML=`${calculation}`;">C</button>
            <button onclick="calculation=calculation/100;document.querySelector('.display').innerHTML=`${calculation}`;">%</button>
            <button onclick="calculation=calculation.slice(0,-1);document.querySelector('.display').innerHTML=`${calculation}`;">DEL</button>
            <button onclick="updateCalculation('/')">/</button>
        </div>
        <div>
            <button onclick="updateCalculation('7');">7</button>
            <button onclick="updateCalculation('8');">8</button>
            <button onclick="updateCalculation('9');">9</button>
            <button onclick="updateCalculation('*');">*</button>
        </div>
        <div>
            <button onclick="updateCalculation('4');">4</button>
            <button onclick="updateCalculation('5');">5</button>
            <button onclick="updateCalculation('6');">6</button>
            <button onclick="updateCalculation('-');"> - </button> 
        </div>
        <div>
            <button onclick="updateCalculation('1');">1</button>
            <button onclick="updateCalculation('2');">2</button>
            <button onclick="updateCalculation('3');">3</button>
            <button onclick="updateCalculation(`&lpar;`);">&lpar;</button> 
        </div>
        <div>
            <button onclick="updateCalculation('0');">0</button>
            <button onclick="updateCalculation('00');">00</button>
            <button onclick="updateCalculation('**');">^</button>
            <button onclick="updateCalculation('hehe');"> ! </button>
        </div>
        <div>
            <button onclick="updateCalculation('+');">+</button>
            <button onclick="calculation=eval(calculation);document.querySelector('.display').innerHTML=`${calculation}`;document.querySelector('.display').innerHTML=`${calculation}`;">=</button>
            <button onclick="updateCalculation('&rpar;');">&rpar;</button>
            <button onclick="updateCalculation('.');">.</button>
        </div>
    </body>
</html>
